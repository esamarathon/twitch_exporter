---
name: Renovate

on:
  workflow_dispatch:
  schedule:
    # weekly, Monday 03:17 UTC
    - cron: "17 3 * * 1"
  push:
    branches:
      - main

jobs:
  renovate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Renovate
        uses: renovatebot/github-action@266fef21329c44765ad42f9dea1f01f5d2d91084 # v46.3.13
        env:
          LOG_LEVEL: debug
          # Renovate needs an explicit repo list; the action no longer
          # derives it from the checkout automatically.
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          # PRs created with GITHUB_TOKEN do not trigger other workflows
          # (build/security/codeql), so auto-merge stays off by default.
          RENOVATE_PLATFORM_AUTOMERGE: "false"
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          configurationFile: renovate.json
